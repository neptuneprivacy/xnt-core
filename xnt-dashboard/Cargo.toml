[package]
name = "xnt-dashboard"
description = "neptune-privacy tui dashboard and wallet"
authors = ["Triton Software"]

version = "0.2.5"
edition = "2021"
license = "Apache-2.0"

homepage = ""
repository = "https://github.com/neptuneprivacy/xnt-core/"

[features]
default = []
mock = ["rand", "neptune-privacy/mock-rpc"]

[dependencies]
anyhow = { version = "1.0" }
neptune-privacy = { version = "0.2.5", path = "../xnt-core" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
tarpc = { version = "^0.34", features = [
    "tokio1",
    "serde-transport",
    "serde-transport-json",
    "tcp",
] }
tokio = { version = "1.41", features = ["full", "tracing"] }
ratatui = "0.29"
itertools = "0.11"
num-traits = "0.2"
unicode-width = "0.1"
strum = { version = "0.27.0", features = ["derive"] }
bytesize = "1.3"
# TODO(triton-vm-v8): this rev is tasm-lib 7.0.0 (triton-vm 7). The v8 upgrade
# needs the fork's `upgrade-v8` branch: tasm-lib v8.0.0 with d6fef3d4 (the u128
# limb range-check) cherry-picked on top. Until that branch is pushed, the
# workspace `[patch]` at the bottom of the root Cargo.toml supplies it locally.
tasm-lib = { git = "https://github.com/neptuneprivacy/tasm-lib", rev = "803223357cc7d50ceba68ea1310911639b86f02f" }
humantime = "2.1.0"
rand = { version = "0.9.2", optional = true }

[dev-dependencies]

[lints]
workspace = true
